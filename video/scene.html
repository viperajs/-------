<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dinner's Ready - renderer</title>
<style>
  @font-face { font-family: "Mont"; font-weight: 900;
    src: url("node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: "Mont"; font-weight: 800;
    src: url("node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 45%, rgba(0,0,0,.78) 100%); }
  #grain { opacity: .10; mix-blend-mode: overlay; image-rendering: pixelated; }
  #flash { background: #ff0010; opacity: 0; mix-blend-mode: normal; }
  #black { background: #000; opacity: 0; }
  .txt { font-family: "Mont", "Noto Color Emoji", sans-serif; font-weight: 900; text-transform: uppercase;
         text-align: center; letter-spacing: 1px; line-height: 1.12; position: absolute; left: 0; width: 1080px;
         paint-order: stroke fill; }
  #topshade { background: linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 14%, rgba(0,0,0,0) 24%); }
  #title { top: 118px; font-size: 74px; color: #fff;
           -webkit-text-stroke: 4px #000; text-shadow: 0 6px 0 #000, 0 0 24px rgba(0,0,0,.9); }
  #title .red, #endtop .red, #endbot .red { color: #ff2b2b; }
  #title .l2 { margin-top: 10px; }
  #sub { top: 1290px; font-size: 128px; -webkit-text-stroke: 14px #000;
         text-shadow: 0 9px 0 #000, 0 0 30px rgba(0,0,0,.8); }
  #sub span { display: inline-block; transform-origin: 50% 60%; }
  .yel { color: #ffd60a; }
  .rd { color: #ff2b2b; }
  #endshade { background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.92) 70%, #000 100%); opacity: 0; }
  #endtop { top: 118px; font-size: 76px; color: #fff; -webkit-text-stroke: 4px #000;
            text-shadow: 0 6px 0 #000, 0 0 24px rgba(0,0,0,.9); opacity: 0; }
  #endtop .l2 { margin-top: 10px; }
  #endbot { top: 1450px; font-size: 104px; color: #fff; opacity: 0; }
  #endbot .l2 { margin-top: 18px; }
  #endbot .l3 { margin-top: 34px; font-size: 56px; color: #ffd60a; }
  #anno { overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="vignette" class="layer"></div>
  <canvas id="grain" class="layer" width="270" height="480"></canvas>
  <div id="topshade" class="layer"></div>
  <svg id="anno" class="layer" viewBox="0 0 1080 1920">
    <circle id="ring" cx="540" cy="900" r="150" fill="none" stroke="#ff1f1f" stroke-width="14"
            stroke-linecap="round" style="filter: drop-shadow(0 0 6px rgba(0,0,0,.8))"/>
    <g id="arrow" style="filter: drop-shadow(0 0 6px rgba(0,0,0,.8))">
      <line id="arrowLine" x1="0" y1="0" x2="0" y2="0" stroke="#ff1f1f" stroke-width="14" stroke-linecap="round"/>
      <polygon id="arrowHead" points="0,0 0,0 0,0" fill="#ff1f1f"/>
    </g>
  </svg>
  <div id="title" class="txt"><div class="l1">MOM CALLED ME DOWN</div><div class="l2 red">FOR DINNER... &#x1F628;</div></div>
  <div id="sub" class="txt"></div>
  <div id="endshade" class="layer"></div>
  <div id="endtop" class="txt"><div class="l1">"SWEETIE, DINNER'S</div>
    <div class="l2 red">READY!"</div></div>
  <div id="endbot" class="txt"><div class="l1">MOM WAS STILL</div><div class="l2 red">AT WORK &#x1F631;</div>
    <div class="l3">SO WHO'S IN THE KITCHEN? &#x1F480;</div></div>
  <div id="flash" class="layer"></div>
  <div id="black" class="layer"></div>
</div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module" src="scene.js"></script>
</body>
</html>
